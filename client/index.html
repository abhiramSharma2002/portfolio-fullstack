<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title (ONLY ONE TITLE) -->
    <title>Abhi | Full Stack Developer</title>

    <!-- Meta Description -->
    <meta name="description" content="Abhi is a Full Stack Developer skilled in React, Node.js, MongoDB, and modern web technologies. Explore projects, skills, and experience." />

    <meta name="keywords" content="Abhi portfolio, full stack developer, react developer, node js developer, mern stack, javascript developer, web developer india" />

    <meta name="author" content="Abhi" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Abhi | Full Stack Developer Portfolio" />
    <meta property="og:description" content="Explore Abhi's developer portfolio built with React, Node.js, MongoDB and modern UI design." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:image" content="/preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abhi | Full Stack Developer Portfolio" />
    <meta name="twitter:description" content="Full Stack Developer portfolio showcasing projects and skills." />
    <meta name="twitter:image" content="/preview.png" />

    <!-- Favicon (replace with dev-style icon if you want) -->
    <link rel="icon" type="image/svg+xml" href="/dev-icon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
